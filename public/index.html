<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Chat column -->
    <section class="chat" aria-label="Chat">
      <header class="brand">
        <h1><span id="app-name">NetPrep</span><span class="tag">prototype</span></h1>
        <span id="mode-badge" class="badge" hidden>demo data</span>
      </header>

      <div id="messages" class="messages" aria-live="polite">
        <div class="intro">
          <p class="intro-lead">Tell me who you are and who you want to meet.</p>
          <p class="intro-sub">I'll map the people worth reaching out to, with talking points for each.</p>
          <div class="chips" id="chips">
            <button class="chip">I'm a UW Informatics freshman aiming for a PM internship at Microsoft</button>
            <button class="chip">I want to break into climate tech as a data analyst in Seattle</button>
            <button class="chip">I'm starting an edtech company and need advisors and early users</button>
          </div>
        </div>
      </div>

      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="Describe your goal…" aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <!-- Map column -->
    <section class="map" aria-label="Network map">
      <div class="map-toolbar">
        <span class="map-title" id="map-title">Network map</span>
        <div class="map-actions">
          <button id="fit" class="ghost" disabled>Fit</button>
          <button id="reset" class="ghost" disabled>New map</button>
        </div>
      </div>

      <div id="empty" class="empty">
        <svg viewBox="0 0 120 80" width="120" height="80" aria-hidden="true">
          <circle cx="14" cy="40" r="5" />
          <path d="M19 40 C 50 40, 50 14, 80 14 M19 40 L80 40 M19 40 C 50 40, 50 66, 80 66" />
          <rect x="84" y="9" width="28" height="10" rx="2" />
          <rect x="84" y="35" width="28" height="10" rx="2" />
          <rect x="84" y="61" width="28" height="10" rx="2" />
        </svg>
        <p>Your network branches out here.</p>
      </div>

      <svg id="graph" class="graph" role="img" aria-label="Branching map of suggested connections"></svg>

      <aside id="detail" class="detail" aria-hidden="true">
        <button id="detail-close" class="detail-close" aria-label="Close">×</button>
        <div id="detail-body"></div>
      </aside>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
